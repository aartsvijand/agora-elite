<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stoellink">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0F3">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Stoellink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: links het invoerblok met knop, rechts het overzicht van alle stoelen; op een telefoon staat alles onder elkaar. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --fg: #121C26;
  --muted: #55626F;
  --line: #CBD3DB;
  --accent: #0A6B74;
  --accent-fg: #FFFFFF;
  --warn: #A5391B;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1419;
    --surface: #161E26;
    --fg: #E4EBF1;
    --muted: #92A0AE;
    --line: #2B3743;
    --accent: #4CC3CC;
    --accent-fg: #06222A;
    --warn: #F0907A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1419;
  --surface: #161E26;
  --fg: #E4EBF1;
  --muted: #92A0AE;
  --line: #2B3743;
  --accent: #4CC3CC;
  --accent-fg: #06222A;
  --warn: #F0907A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100%;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app {
  max-width: 46rem;
  margin-inline: auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr));
  gap: 28px;
  align-items: start;
}
.head { grid-column: 1 / -1; display: grid; gap: 6px; }
.head h1 {
  margin: 0;
  font: 700 2.5rem/1 var(--font-display);
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.eyebrow, .label {
  margin: 0;
  font: 500 0.75rem/1.2 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.panel {
  min-width: 0;
  display: grid;
  gap: 14px;
  padding: 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
#seat {
  width: 100%;
  min-width: 0;
  padding: 0.06em 0.1em;
  font: 700 clamp(4.5rem, 22vw, 7rem) / 1 var(--font-display);
  letter-spacing: 0.03em;
  font-variant-numeric: tabular-nums;
  text-align: center;
  color: var(--fg);
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 10px;
}
#seat:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
.hint { margin: 0; min-height: 1.5em; font-size: 0.9rem; color: var(--muted); }
.hint.bad { color: var(--warn); }

.go {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  min-height: 58px;
  padding-inline: 16px;
  font: 600 1.15rem/1.2 var(--font-body);
  text-decoration: none;
  color: var(--accent-fg);
  background: var(--accent);
  border-radius: 10px;
}
.go::after { content: "\2197"; }
.go:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.go[aria-disabled="true"] { background: var(--line); color: var(--muted); pointer-events: none; }
.url {
  margin: 0;
  min-height: 2.8em;
  font: 400 0.78rem/1.4 var(--font-mono);
  color: var(--muted);
  overflow-wrap: anywhere;
}
.toggle { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; min-height: 32px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

.recent-block { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.overview { min-width: 0; display: grid; gap: 12px; }
.overview-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(3.4rem, 1fr)); gap: 8px; }
.chips.recent { display: flex; flex-wrap: wrap; }
.chip {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding-inline: 12px;
  font: 500 0.95rem/1 var(--font-mono);
  font-variant-numeric: tabular-nums;
  text-decoration: none;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.chip:hover { border-color: var(--accent); }
.chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chip[aria-current="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.foot { grid-column: 1 / -1; margin: 0; font-size: 0.85rem; color: var(--muted); max-width: 65ch; }
</style>

<div class="app">
  <header class="head">
    <p class="eyebrow">Stoelen 101 tot 156</p>
    <h1>Stoellink</h1>
  </header>

  <form id="form" class="panel" autocomplete="off">
    <label for="seat" class="label">Stoelnummer</label>
    <input id="seat" name="seat" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" enterkeyhint="go" autocomplete="off" aria-describedby="hint" value="142">
    <p id="hint" class="hint" role="status"></p>
    <a id="go" class="go" target="_blank" rel="noopener noreferrer">Open stoel</a>
    <p id="url" class="url"></p>
    <label class="toggle" for="auto"><input id="auto" type="checkbox" checked> Direct openen na 3 cijfers</label>
    <div id="recentBlock" class="recent-block" hidden>
      <h2 class="label">Laatst geopend</h2>
      <div id="recent" class="chips recent"></div>
    </div>
  </form>

  <section class="overview" aria-labelledby="allLabel">
    <div class="overview-head">
      <h2 id="allLabel" class="label">Alle stoelen</h2>
      <span class="label">56 stoelen</span>
    </div>
    <div id="grid" class="chips"></div>
  </section>

  <p class="foot">Elke link hoort bij het id van de stoel. Stoel 151 is id 300904, stoel 152 is 300905, stoel 150 is 300903. Klopt een stoel niet, dan zit er ergens een gat in de nummering.</p>
</div>

<script>
(function () {
  var FIRST = 101, LAST = 156;
  var BASE = 300753; // id = stoelnummer + BASE, dus stoel 151 = 300904
  var PREFIX = "https://kuleuven.be/kurtqr?id=";

  var $ = function (id) { return document.getElementById(id); };
  var seat = $("seat"), go = $("go"), hint = $("hint"), urlEl = $("url");
  var auto = $("auto"), grid = $("grid"), recent = $("recent"), recentBlock = $("recentBlock");

  function linkFor(n) { return PREFIX + (n + BASE); }
  function parse(v) {
    if (!/^\d{3}$/.test(v)) return null;
    var n = parseInt(v, 10);
    return n >= FIRST && n <= LAST ? n : null;
  }
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function write(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var recents = [];
  try {
    recents = JSON.parse(read("recents") || "[]").filter(function (n) { return n >= FIRST && n <= LAST; });
  } catch (e) { recents = []; }
  if (read("auto") === "0") auto.checked = false;
  if (recents.length) seat.value = String(recents[0]);

  function makeChip(n) {
    var a = document.createElement("a");
    a.className = "chip";
    a.href = linkFor(n);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.dataset.n = String(n);
    a.textContent = String(n);
    return a;
  }
  for (var n = FIRST; n <= LAST; n++) grid.appendChild(makeChip(n));

  function renderRecent() {
    recent.textContent = "";
    recents.forEach(function (n) { recent.appendChild(makeChip(n)); });
    recentBlock.hidden = recents.length === 0;
  }
  function remember(n) {
    recents = [n].concat(recents.filter(function (x) { return x !== n; })).slice(0, 6);
    write("recents", JSON.stringify(recents));
    setTimeout(renderRecent, 0); // na de klik, zodat de aangetikte link niet midden in het openen verdwijnt
  }

  function render() {
    var v = seat.value.trim();
    var n = parse(v);
    if (n) {
      go.href = linkFor(n);
      go.removeAttribute("aria-disabled");
      go.textContent = "Open stoel " + n;
      urlEl.textContent = linkFor(n);
      hint.textContent = "Klaar. Tik op de knop of druk op Enter.";
      hint.className = "hint";
    } else {
      go.removeAttribute("href");
      go.setAttribute("aria-disabled", "true");
      go.textContent = "Open stoel";
      urlEl.textContent = "";
      if (/\D/.test(v)) {
        hint.textContent = "Gebruik alleen cijfers.";
        hint.className = "hint bad";
      } else if (v.length === 3) {
        hint.textContent = "Stoel " + v + " bestaat niet. Kies 101 tot 156.";
        hint.className = "hint bad";
      } else {
        hint.textContent = "Typ een nummer van 101 tot 156.";
        hint.className = "hint";
      }
    }
    Array.prototype.forEach.call(grid.children, function (c) {
      if (n && c.dataset.n === String(n)) c.setAttribute("aria-current", "true");
      else c.removeAttribute("aria-current");
    });
  }

  seat.addEventListener("input", function (e) {
    var cleaned = seat.value.replace(/\D/g, "").slice(0, 3);
    if (cleaned !== seat.value) seat.value = cleaned;
    render();
    var deleting = e && e.inputType && e.inputType.indexOf("delete") === 0;
    if (auto.checked && !deleting && parse(seat.value)) go.click();
  });
  seat.addEventListener("focus", function () { setTimeout(function () { seat.select(); }, 0); });
  auto.addEventListener("change", function () { write("auto", auto.checked ? "1" : "0"); });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (parse(seat.value.trim())) go.click();
  });

  go.addEventListener("click", function (e) {
    var n = parse(seat.value.trim());
    if (!n) { e.preventDefault(); return; }
    remember(n);
  });

  document.addEventListener("click", function (e) {
    var chip = e.target.closest ? e.target.closest("a.chip") : null;
    if (!chip) return;
    var n = parseInt(chip.dataset.n, 10);
    seat.value = String(n);
    render();
    remember(n);
  });

  renderRecent();
  render();
})();
</script>

</html>
